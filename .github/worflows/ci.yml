# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
    - run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
    - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "npm"
    - run: npm test
